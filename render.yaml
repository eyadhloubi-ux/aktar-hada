# إعداد النشر على Render (Blueprint)
# من Render: New + → Blueprint → اختار الريبو، وبيتعمل كل شي لحالو.
services:
  - type: web
    name: qa3da-aktar-hada
    runtime: node
    plan: free            # للاستخدام الحقيقي بالسهرات الأفضل خطة مدفوعة (ما بتنام)
    region: frankfurt     # الأقرب لسوريا
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: STATS_KEY
        generateValue: true   # مفتاح صفحة الإحصائيات: بتلاقيه بـ Environment بعد النشر
      # لحفظ الإحصائيات بشكل دائم: اعمل Postgres على Render وحط رابطه هون
      # - key: DATABASE_URL
      #   fromDatabase:
      #     name: qa3da-db
      #     property: connectionString
